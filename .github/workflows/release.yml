name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $tag does not match package version $package_version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag is already published" >&2
              exit 1
            fi
            echo "Reusing existing draft release $tag"
          else
            gh release create "$tag" \
              --draft \
              --generate-notes \
              --title "Building Sunlight Simulator $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: Validate release source
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:verify
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  build:
    name: Build ${{ matrix.platform }} release assets
    needs: [create-release, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
          - platform: macos
            os: macos-latest
            bundles: dmg
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget
      - run: npm ci
      - name: Build release bundles
        run: npm run desktop:build -- --ci --bundles "${{ matrix.bundles }}"
      - name: Smoke test Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Resolve-Path 'src-tauri/target/release/building-sunlight-simulator.exe'
          $process = Start-Process -FilePath $app.Path -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "Application exited during startup with code $($process.ExitCode)"
            }
            Write-Host "Application remained active for 10 seconds (PID $($process.Id))"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
      - name: Verify bundle output exists
        shell: bash
        run: test -n "$(find src-tauri/target/release/bundle -type f -print -quit)"
      - name: Upload platform bundles for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-assets
      - name: Collect and hash release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir publish-assets
          while IFS= read -r -d '' asset; do
            cp "$asset" publish-assets/
          done < <(find release-assets -type f \( \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.deb' \
          \) -print0)

          shopt -s nullglob
          windows_exe=(publish-assets/*.exe)
          windows_msi=(publish-assets/*.msi)
          macos_dmg=(publish-assets/*.dmg)
          linux_appimage=(publish-assets/*.AppImage)
          linux_deb=(publish-assets/*.deb)
          if (( ${#windows_exe[@]} != 1 || ${#windows_msi[@]} != 1 || \
                ${#macos_dmg[@]} != 1 || ${#linux_appimage[@]} != 1 || \
                ${#linux_deb[@]} != 1 )); then
            echo "Expected exactly one package for each release format" >&2
            find publish-assets -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

          find publish-assets -maxdepth 1 -type f -print | sort
          cd publish-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            publish-assets/* \
            --clobber
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false
