name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:verify
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  desktop-build:
    name: Desktop ${{ matrix.platform }} bundle
    needs: javascript
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
          - platform: macos
            os: macos-latest
            bundles: dmg
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget
      - run: npm ci
      - name: Build desktop bundles
        run: npm run desktop:build -- --ci --bundles "${{ matrix.bundles }}"
      - name: Smoke test Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Resolve-Path 'src-tauri/target/release/building-sunlight-simulator.exe'
          $process = Start-Process -FilePath $app.Path -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "Application exited during startup with code $($process.ExitCode)"
            }
            Write-Host "Application remained active for 10 seconds (PID $($process.Id))"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
      - name: Verify bundle output exists
        shell: bash
        run: test -n "$(find src-tauri/target/release/bundle -type f -print -quit)"
      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: building-sunlight-simulator-${{ matrix.platform }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
